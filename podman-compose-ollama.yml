# OpenClaw + QMD Memory — Podman Compose setup
# Uses cloud LLM providers (OpenAI, Anthropic, etc.) with QMD memory backend.
#
# Usage:
#   1. Copy .env.ollama.example to .env and fill in your API keys
#   2. ./setup-ollama.sh          (first run builds the custom image)
#   3. Open http://localhost:18789/#token=<your-token>
#
# Requirements:
#   - podman + podman-compose

services:
  # ── OpenClaw Gateway (with QMD memory backend) ───────────────────────────
  openclaw-gateway:
    image: localhost/openclaw-qmd:latest
    container_name: openclaw-gateway
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      # Model provider keys (set at least one in .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Channel tokens (optional — set the ones you use)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    ports:
      # Host-side: bind to loopback only (this is where network security is enforced)
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT}:18789"
      - "127.0.0.1:${OPENCLAW_BRIDGE_PORT}:18790"
      # AI Project Manager Kanban board UI
      - "127.0.0.1:8420:8420"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        # Inside the container: must be lan (0.0.0.0) so Podman port forwarding works.
        # External access is restricted by the 127.0.0.1 port mapping above.
        "lan",
        "--port",
        "18789",
      ]

  # ── OpenClaw CLI (on-demand) ─────────────────────────────────────────────
  openclaw-cli:
    image: localhost/openclaw-qmd:latest
    container_name: openclaw-cli
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      BROWSER: "echo"
      # CLI only needs the gateway token; model keys live in the gateway
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    profiles:
      - cli

  # ── QMD MCP HTTP (optional standalone) ───────────────────────────────────
  qmd:
    image: tobi/qmd:latest
    container_name: qmd
    command: ["mcp","--http","--port","8181","--daemon"]
    environment:
      HOME: /home/qmd
    volumes:
      - ${OPENCLAW_WORKSPACE_DIR}:/workspace:ro
    ports:
      - "127.0.0.1:8181:8181"
    restart: unless-stopped
